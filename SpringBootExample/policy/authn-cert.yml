---
# authn-cert.yml — Conjur policy for authn-cert (mTLS) E2E testing of the Spring Boot SDK.
# The host CN annotation MUST match the CN used in the client certificate
# generated by generate-certs.sh (default: spring-cert-host).

- !policy
  id: conjur/authn-cert/spring-cert
  body:
    - !webservice
      annotations:
        description: Certificate-based (mTLS) authenticator for Spring Boot SDK E2E tests

    - !variable ca-cert

    - !group apps

    - !permit
      role: !group apps
      privilege: [read, authenticate]
      resource: !webservice

- !host
  id: spring-cert-host
  annotations:
    authn-cert/spring-cert/cn: spring-cert-host

- !grant
  role: !group conjur/authn-cert/spring-cert/apps
  member: !host spring-cert-host

- !permit
  role: !host spring-cert-host
  privilege: [read, execute]
  resource: !variable db/password

- !permit
  role: !host spring-cert-host
  privilege: [read, execute]
  resource: !variable db/dbuserName

- !permit
  role: !host spring-cert-host
  privilege: [read, execute]
  resource: !variable db/dbpassWord

- !permit
  role: !host spring-cert-host
  privilege: [read, execute]
  resource: !variable db/key

- !permit
  role: !host spring-cert-host
  privilege: [read, execute]
  resource: !variable "my var"
